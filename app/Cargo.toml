[package]
name = "screenmate"
version = "0.1.1"
edition = "2021"

[dependencies]
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
eframe = "0.27"
image = { version = "0.24", default-features = false, features = ["jpeg", "png"] }
screenshots = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tiny_http = "0.12"
tray-icon = "0.14"
uuid = { version = "1", features = ["v4"] }
windows-sys = { version = "0.52", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_UI_WindowsAndMessaging", "Win32_System_Threading", "Win32_System_StationsAndDesktops", "Win32_System_Registry", "Win32_Security", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_HiDpi"] }

